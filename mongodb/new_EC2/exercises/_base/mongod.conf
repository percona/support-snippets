# /etc/mongod.conf — lab default. Per-level setup.sh may amend (e.g. add a
# replication.replSetName block, change cache, etc.) and reload mongod.
storage:
  dbPath: /var/lib/mongo

systemLog:
  destination: file
  path: /var/log/mongo/mongod.log
  logAppend: true

processManagement:
  fork: true
  pidFilePath: /var/run/mongod.pid
  timeZoneInfo: /usr/share/zoneinfo

net:
  port: 27017
  bindIp: 0.0.0.0
