worker_processes auto;
events { worker_connections 1024; }

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;
    sendfile on;
    keepalive_timeout 65;

    # docker's embedded DNS so we can re-resolve exercise-current after restarts
    resolver 127.0.0.11 valid=5s ipv6=off;

    map $http_upgrade $connection_upgrade {
        default upgrade;
        ''      close;
    }

    server {
        listen 80;
        server_name _;
        client_max_body_size 1m;

        # ---- HTTP basic-auth -------------------------------------------------
        # Whole site is gated by a shared credential so a public IP isn't wide
        # open. The same realm string is used everywhere so the browser reuses
        # the credential across /, /term/ and /static without re-prompting.
        # The interviewer dashboard + /reset additionally require an
        # interviewer-only credential (see the dedicated locations below).
        auth_basic           "Interview Lab";
        auth_basic_user_file /etc/nginx/auth/htpasswd;

        # Health check stays open (ALB / uptime probes).
        location = /healthz {
            auth_basic off;
            proxy_pass http://controller:5000;
        }

        # Interviewer dashboard: interviewer-only credential. The interviewer
        # user must also exist in the site-wide htpasswd so loading /static
        # (served under "/") doesn't trip a second auth prompt.
        location /interviewer/ {
            auth_basic           "Interview Lab";
            auth_basic_user_file /etc/nginx/auth/htpasswd-interviewer;
            proxy_pass http://controller:5000;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_read_timeout 420s;
        }

        # Reset is destructive — interviewer-only, never the candidate.
        location = /reset {
            auth_basic           "Interview Lab";
            auth_basic_user_file /etc/nginx/auth/htpasswd-interviewer;
            proxy_pass http://controller:5000;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_read_timeout 420s;
        }

        # ---- controller (exercise page, /check) ----
        location / {
            proxy_pass http://controller:5000;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_read_timeout 420s;
        }

        # ---- embedded terminal: /term/<node>/... routes to that node's ttyd ----
        location ~ ^/term/(?<node>[a-zA-Z0-9_-]+)/ {
            set $upstream "exercise-current-${node}:7681";
            proxy_pass http://$upstream;

            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection $connection_upgrade;
            proxy_read_timeout 86400s;
            proxy_send_timeout 86400s;

            # Inject a script into ttyd's HTML to disable paste/clipboard tricks.
            proxy_set_header Accept-Encoding "";
            sub_filter_once on;
            sub_filter '</head>' '<style>html,body,.xterm,.xterm *{user-select:none!important;-webkit-user-select:none!important;-moz-user-select:none!important;-ms-user-select:none!important;}.xterm-selection-layer,.xterm .xterm-selection{display:none!important;}</style><script>(function(){var block=function(e){e.preventDefault();e.stopImmediatePropagation();return false;};["paste","copy","cut","contextmenu","drop","dragover","selectstart"].forEach(function(ev){document.addEventListener(ev,block,true);window.addEventListener(ev,block,true);});document.addEventListener("keydown",function(e){var k=(e.key||"").toLowerCase();if(e.shiftKey&&e.key==="Insert")return block(e);if((e.ctrlKey||e.metaKey)&&e.shiftKey&&k==="v")return block(e);if((e.ctrlKey||e.metaKey)&&k==="v")return block(e);if((e.ctrlKey||e.metaKey)&&k==="insert")return block(e);},true);document.addEventListener("mousedown",function(e){if(e.button===1)return block(e);if(e.button===0&&e.target&&e.target.closest&&e.target.closest(".xterm")){e.preventDefault();e.stopImmediatePropagation();var ta=document.querySelector(".xterm-helper-textarea");if(ta)ta.focus();return false;}},true);document.addEventListener("mouseup",function(e){if(e.target&&e.target.closest&&e.target.closest(".xterm")){e.preventDefault();e.stopImmediatePropagation();}},true);document.addEventListener("dblclick",function(e){if(e.target&&e.target.closest&&e.target.closest(".xterm")){e.preventDefault();e.stopImmediatePropagation();}},true);if(navigator.clipboard){navigator.clipboard.readText=function(){return Promise.reject(new Error("disabled"));};navigator.clipboard.read=function(){return Promise.reject(new Error("disabled"));};navigator.clipboard.writeText=function(){return Promise.reject(new Error("disabled"));};navigator.clipboard.write=function(){return Promise.reject(new Error("disabled"));};}var _ec=document.execCommand&&document.execCommand.bind(document);if(_ec){document.execCommand=function(cmd){var c=(cmd||"").toLowerCase();if(c==="copy"||c==="cut"||c==="paste")return false;return _ec.apply(document,arguments);};}})();</script></head>';

            # Friendly 502 page when no exercise container is up yet
            error_page 502 504 = @no_exercise;
        }

        location @no_exercise {
            default_type text/html;
            return 200 '<html><head><meta http-equiv="refresh" content="5"></head><body style="font-family:sans-serif;padding:2em;color:#888;background:#000">Starting exercise</body></html>';
        }
    }
}
