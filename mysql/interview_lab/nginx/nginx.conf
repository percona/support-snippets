worker_processes auto;
events { worker_connections 1024; }

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;
    sendfile on;
    keepalive_timeout 65;

    # docker's embedded DNS so we can re-resolve exercise-current after restarts.
    # Kept at 1s: after a Send the name is reused by a new container, and for as
    # long as the old IP is cached the terminal gets the placeholder below.
    resolver 127.0.0.11 valid=1s ipv6=off;

    map $http_upgrade $connection_upgrade {
        default upgrade;
        ''      close;
    }

    server {
        listen 80;
        server_name _;
        client_max_body_size 1m;

        # ---- HTTP basic-auth -------------------------------------------------
        # Whole site is gated by a shared credential so a public IP isn't wide
        # open. The same realm string is used everywhere so the browser reuses
        # the credential across /, /term/ and /static without re-prompting.
        # The interviewer dashboard + /reset additionally require an
        # interviewer-only credential (see the dedicated locations below).
        auth_basic           "Interview Lab";
        auth_basic_user_file /etc/nginx/auth/htpasswd;

        # ---- controller shared secret ----------------------------------------
        # The controller answers only requests carrying this header, so a
        # candidate who somehow reaches it from an exercise shell still gets a
        # 403 — the network keeps them off it, this keeps them off it if the
        # network ever does not. nginx cannot read environment variables from
        # its config, so docker-compose.yml renders CONTROLLER_SECRET into this
        # one-line file (a single `set $controller_key`) before nginx starts.
        # Sent on every proxy_pass to the controller below and never to ttyd:
        # the candidate has root in that container and could read it there.
        include /etc/nginx/controller-secret.conf;

        # Health check stays open (ALB / uptime probes).
        location = /healthz {
            auth_basic off;
            proxy_pass http://controller:5000;
            proxy_set_header X-Controller-Key $controller_key;
        }

        # Interviewer dashboard: interviewer-only credential. The interviewer
        # user must also exist in the site-wide htpasswd so loading /static
        # (served under "/") doesn't trip a second auth prompt.
        location /interviewer/ {
            auth_basic           "Interview Lab";
            auth_basic_user_file /etc/nginx/auth/htpasswd-interviewer;
            proxy_pass http://controller:5000;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Controller-Key $controller_key;
            proxy_read_timeout 420s;
        }

        # Reset is destructive — interviewer-only, never the candidate.
        location = /reset {
            auth_basic           "Interview Lab";
            auth_basic_user_file /etc/nginx/auth/htpasswd-interviewer;
            proxy_pass http://controller:5000;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Controller-Key $controller_key;
            proxy_read_timeout 420s;
        }

        location = /unlock {
            auth_basic           "Interview Lab";
            auth_basic_user_file /etc/nginx/auth/htpasswd-interviewer;
            proxy_pass http://controller:5000;
            proxy_set_header X-Controller-Key $controller_key;
        }

        location = /term-auth {
            internal;
            proxy_pass http://controller:5000;
            proxy_set_header X-Controller-Key $controller_key;
        }

        # ---- controller (exercise page, /check) ----
        location / {
            proxy_pass http://controller:5000;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Controller-Key $controller_key;
            proxy_read_timeout 420s;
        }

        # ---- embedded terminal: /term/<node>/... routes to that node's ttyd ----
        location ~ ^/term/(?<node>[a-zA-Z0-9_-]+)/ {
            auth_request /term-auth;
            error_page 403 = @locked_term;
            set $upstream "mysql-exercise-current-${node}:7681";
            proxy_pass http://$upstream;

            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection $connection_upgrade;
            proxy_read_timeout 86400s;
            proxy_send_timeout 86400s;

            # Inject the guard script into ttyd's HTML. It blocks paste, which
            # is the control that matters; selecting and copying text OUT of
            # the terminal is deliberately left alone. The briefing tells
            # candidates that docs and search are allowed, so blocking copy
            # only penalised the honest ones (anyone cheating photographs the
            # screen), and the controller's paste classifier already treats
            # text that came from the terminal as benign.
            proxy_set_header Accept-Encoding "";
            sub_filter_once on;
            sub_filter '</head>' '<style>html,body,.xterm,.xterm *{user-select:none!important;-webkit-user-select:none!important;-moz-user-select:none!important;-ms-user-select:none!important;}.xterm-selection-layer,.xterm .xterm-selection{display:none!important;}</style><script src="/static/cadence.js"></script><script src="/static/terminal-guard.js"></script></head>';

            # Friendly 502 page when no exercise container is up yet
            error_page 502 504 = @no_exercise;
        }

        location @locked_term {
            default_type text/html;
            return 403 '<html><body style="font-family:sans-serif;padding:2em;background:#111;color:#fff">This session is locked. The interviewer has been notified.</body></html>';
        }

        # Refreshes the terminal frame until ttyd answers. After 20s of
        # failures in a row it asks the controller to bring back whatever is
        # missing: a background GET of / runs the same lazy start as a page
        # load, which respawns only the nodes that are gone and does nothing
        # while they merely boot, so asking early is harmless. It replaces a
        # reload of the top page, which dropped every open shell and, with
        # unsaved text in the Files editor, stopped on the browser's "Leave
        # site?" dialog — so it waited 90s to be sure and 5 minutes between
        # tries. At most once a minute now: a spawn takes 30-60s to answer and
        # a second ask inside that window finds nothing missing. No `$` or
        # single quotes in the string: nginx reads them as a variable / its end.
        location @no_exercise {
            default_type text/html;
            return 200 '<html><head><meta http-equiv="refresh" content="2"><script>try{var s=sessionStorage,n=Date.now(),k="noex:"+location.pathname,f=JSON.parse(s.getItem(k)||"null");if(!f||n-f.last>20000)f={first:n};f.last=n;s.setItem(k,JSON.stringify(f));if(n-f.first>20000&&n-(+s.getItem("noex:heal")||0)>60000){s.setItem("noex:heal",n);fetch("/",{cache:"no-store"}).catch(function(){})}}catch(e){}</script></head><body style="font-family:sans-serif;padding:2em;color:#888;background:#000">Starting exercise</body></html>';
        }
    }
}
